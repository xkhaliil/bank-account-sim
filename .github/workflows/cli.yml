name: cli

on:
  push:
    paths:
      - "apps/cli/**"
      - "features/bank/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
      - "tsconfig.base.json"
      - ".prettierrc"
      - ".github/workflows/cli.yml"
      - ".github/actions/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm nx run cli:lint
      - run: pnpm start report CHK-001
      - run: pnpm start withdraw CHK-001 50
