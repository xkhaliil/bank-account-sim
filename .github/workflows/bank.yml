name: bank

on:
  push:
    paths:
      - "features/bank/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
      - "tsconfig.base.json"
      - ".prettierrc"
      - ".github/workflows/bank.yml"
      - ".github/actions/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm nx run bank:lint
